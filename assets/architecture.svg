<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">MCP Virtual Computer deployment boundaries</title>
  <desc id="desc">A side-by-side comparison showing which components run on the user's computer in local Docker mode and Fly.io mode, and how MCP tool calls and VNC desktop pixels move between them.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#16845b"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: "Segoe UI", Inter, Arial, sans-serif; fill: #172033; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .boundary { fill: #f8fafc; stroke: #64748b; stroke-width: 2; stroke-dasharray: 9 7; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .workload { fill: #f4f8ff; stroke: #2563eb; stroke-width: 2; }
      .screen { fill: #f2fbf7; stroke: #16845b; stroke-width: 2; }
      .title { font-size: 34px; font-weight: 650; }
      .subtitle { font-size: 18px; fill: #526071; }
      .mode { font-size: 14px; font-weight: 700; letter-spacing: 1.6px; fill: #475569; }
      .heading { font-size: 25px; font-weight: 650; }
      .boundary-label { font-size: 14px; font-weight: 700; letter-spacing: 1.3px; fill: #475569; }
      .node-title { font-size: 19px; font-weight: 650; }
      .body { font-size: 15px; fill: #526071; }
      .small { font-size: 13px; fill: #64748b; }
      .path-label { font-size: 13px; font-weight: 650; }
      .control { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .display { fill: none; stroke: #16845b; stroke-width: 3; marker-end: url(#arrow-green); }
      .open-ui { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1800" height="1040" fill="#f5f7fa"/>
  <text x="70" y="66" class="title">Where MCP Virtual Computer runs</text>
  <text x="70" y="98" class="subtitle">The same client and browser experience; only the Xfce computer moves.</text>

  <!-- Local mode -->
  <rect x="55" y="135" width="825" height="765" rx="16" class="panel"/>
  <text x="90" y="178" class="mode">LOCAL MODE</text>
  <text x="90" y="211" class="heading">Docker</text>
  <rect x="85" y="235" width="765" height="620" rx="12" class="boundary"/>
  <text x="108" y="266" class="boundary-label">YOUR COMPUTER</text>

  <rect x="115" y="300" width="190" height="105" rx="10" class="node"/>
  <text x="210" y="341" text-anchor="middle" class="node-title">MCP Client</text>
  <text x="210" y="369" text-anchor="middle" class="body">calls tools</text>

  <rect x="370" y="300" width="215" height="105" rx="10" class="node"/>
  <text x="478" y="338" text-anchor="middle" class="node-title">MCP Server</text>
  <text x="478" y="365" text-anchor="middle" class="body">tools + VNC relay</text>
  <text x="478" y="387" text-anchor="middle" class="small">local Python process</text>

  <rect x="635" y="280" width="180" height="430" rx="12" class="boundary"/>
  <text x="725" y="311" text-anchor="middle" class="boundary-label">DOCKER ENGINE</text>
  <rect x="657" y="345" width="136" height="255" rx="10" class="workload"/>
  <text x="725" y="382" text-anchor="middle" class="node-title">Container</text>
  <line x1="674" y1="400" x2="776" y2="400" stroke="#cbd5e1"/>
  <text x="725" y="435" text-anchor="middle" class="body">Xfce desktop</text>
  <text x="725" y="468" text-anchor="middle" class="body">VNC server</text>
  <text x="725" y="501" text-anchor="middle" class="body">Files</text>
  <text x="725" y="542" text-anchor="middle" class="small">the actual</text>
  <text x="725" y="562" text-anchor="middle" class="small">virtual computer</text>
  <text x="725" y="638" text-anchor="middle" class="small">Uses local</text>
  <text x="725" y="660" text-anchor="middle" class="small">CPU · RAM · disk</text>

  <rect x="115" y="535" width="470" height="240" rx="10" class="node"/>
  <text x="140" y="571" class="node-title">Browser</text>
  <text x="560" y="571" text-anchor="end" class="small">uses local CPU / GPU / RAM</text>
  <rect x="142" y="610" width="180" height="105" rx="9" class="screen"/>
  <text x="232" y="650" text-anchor="middle" class="node-title">noVNC</text>
  <text x="232" y="678" text-anchor="middle" class="body">desktop pixels</text>
  <rect x="350" y="610" width="205" height="105" rx="9" class="node"/>
  <text x="453" y="650" text-anchor="middle" class="node-title">Three.js</text>
  <text x="453" y="678" text-anchor="middle" class="body">3D computer view</text>
  <path d="M322 663 H350" class="display"/>

  <path d="M305 352 H370" class="control"/>
  <text x="338" y="339" text-anchor="middle" class="path-label" fill="#2563eb">tools</text>
  <path d="M585 337 H657" class="control"/>
  <path d="M657 382 H585" class="display"/>
  <path d="M478 405 V470 H232 V610" class="display"/>
  <text x="548" y="458" text-anchor="middle" class="path-label" fill="#16845b">VNC stream</text>
  <path d="M210 405 V500 H350 V535" class="open-ui"/>
  <text x="232" y="493" class="small">opens computer_ui</text>

  <!-- Fly mode -->
  <rect x="920" y="135" width="825" height="765" rx="16" class="panel"/>
  <text x="955" y="178" class="mode">CLOUD MODE</text>
  <text x="955" y="211" class="heading">Fly.io</text>
  <rect x="950" y="235" width="490" height="620" rx="12" class="boundary"/>
  <text x="973" y="266" class="boundary-label">YOUR COMPUTER</text>

  <rect x="980" y="300" width="180" height="105" rx="10" class="node"/>
  <text x="1070" y="341" text-anchor="middle" class="node-title">MCP Client</text>
  <text x="1070" y="369" text-anchor="middle" class="body">calls tools</text>

  <rect x="1210" y="300" width="200" height="105" rx="10" class="node"/>
  <text x="1310" y="338" text-anchor="middle" class="node-title">MCP Server</text>
  <text x="1310" y="365" text-anchor="middle" class="body">tools + VNC relay</text>
  <text x="1310" y="387" text-anchor="middle" class="small">local Python process</text>

  <rect x="980" y="535" width="430" height="240" rx="10" class="node"/>
  <text x="1005" y="571" class="node-title">Browser</text>
  <text x="1385" y="571" text-anchor="end" class="small">uses local CPU / GPU / RAM</text>
  <rect x="1007" y="610" width="165" height="105" rx="9" class="screen"/>
  <text x="1090" y="650" text-anchor="middle" class="node-title">noVNC</text>
  <text x="1090" y="678" text-anchor="middle" class="body">desktop pixels</text>
  <rect x="1200" y="610" width="180" height="105" rx="9" class="node"/>
  <text x="1290" y="650" text-anchor="middle" class="node-title">Three.js</text>
  <text x="1290" y="678" text-anchor="middle" class="body">3D computer view</text>
  <path d="M1172 663 H1200" class="display"/>

  <rect x="1475" y="235" width="240" height="620" rx="12" class="boundary"/>
  <text x="1595" y="266" text-anchor="middle" class="boundary-label">FLY.IO CLOUD</text>
  <rect x="1500" y="345" width="190" height="315" rx="10" class="workload"/>
  <text x="1595" y="382" text-anchor="middle" class="node-title">Permanent</text>
  <text x="1595" y="406" text-anchor="middle" class="node-title">Fly Machine</text>
  <line x1="1522" y1="424" x2="1668" y2="424" stroke="#cbd5e1"/>
  <text x="1595" y="460" text-anchor="middle" class="body">Xfce desktop</text>
  <text x="1595" y="493" text-anchor="middle" class="body">VNC server</text>
  <text x="1595" y="526" text-anchor="middle" class="body">Persistent files</text>
  <text x="1595" y="574" text-anchor="middle" class="small">the actual</text>
  <text x="1595" y="594" text-anchor="middle" class="small">virtual computer</text>
  <text x="1595" y="700" text-anchor="middle" class="small">Uses Fly resources</text>
  <text x="1595" y="722" text-anchor="middle" class="small">default: 1 CPU · 1 GB</text>
  <text x="1595" y="744" text-anchor="middle" class="small">persistent disk</text>

  <path d="M1160 352 H1210" class="control"/>
  <text x="1185" y="339" text-anchor="middle" class="path-label" fill="#2563eb">tools</text>
  <path d="M1410 337 H1500" class="control"/>
  <text x="1455" y="324" text-anchor="middle" class="small">HTTPS</text>
  <path d="M1500 382 H1410" class="display"/>
  <path d="M1310 405 V470 H1090 V610" class="display"/>
  <text x="1390" y="458" text-anchor="middle" class="path-label" fill="#16845b">VNC over WSS</text>
  <path d="M1070 405 V500 H1195 V535" class="open-ui"/>
  <text x="1092" y="493" class="small">opens computer_ui</text>

  <!-- Legend and takeaway -->
  <line x1="95" y1="947" x2="145" y2="947" class="control"/>
  <text x="160" y="953" class="body">MCP tool/control path</text>
  <line x1="390" y1="947" x2="440" y2="947" class="display"/>
  <text x="455" y="953" class="body">VNC display path</text>
  <line x1="675" y1="947" x2="725" y2="947" class="open-ui"/>
  <text x="740" y="953" class="body">opens the browser UI</text>
  <rect x="990" y="923" width="710" height="54" rx="9" fill="#eef2f7"/>
  <text x="1015" y="946" class="body">Docker keeps the Xfce computer on your machine.</text>
  <text x="1015" y="968" class="body">Fly moves only that computer workload to the cloud.</text>
</svg>
