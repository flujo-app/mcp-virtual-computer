# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

# We use "ruff" for linting and formatting

name: Format and Lint

on:
  push:
  pull_request:
    branches: [main]

jobs:
  format_and_lint:
    name: Format and Lint Python
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download misspell tool
        run: |
          wget https://github.com/client9/misspell/releases/download/v0.3.4/misspell_0.3.4_linux_64bit.tar.gz
          tar -xzf misspell_0.3.4_linux_64bit.tar.gz
          chmod +x misspell

      - name: Run misspell
        run: ./misspell -error .

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: |
          uv run ruff check

      - name: Format with ruff
        run: |
          uv run ruff format --check src

      - name: Typecheck with ty
        run: |
          uv run ty check
