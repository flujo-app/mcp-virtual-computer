services:
  virtual-computer:
    build: .
    command:
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --allow-unauthenticated-http
    environment:
      COMPUTER_ID: ${COMPUTER_ID:-agent-workstation}
      DESKTOP_ENVIRONMENT: ${DESKTOP_ENVIRONMENT:-false}
      NETWORK_ACCESS: ${NETWORK_ACCESS:-true}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
